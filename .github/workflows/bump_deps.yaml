name: bump_deps

on:
  schedule:
    - cron: '0 0 */3 * *'
  workflow_dispatch:

# 不再提交 main：酒馆的扩展更新检查是「git log 本地HEAD..origin/main 非空即提示」，
# 纯依赖更新（源码零变化）提交 main 会每 3 天让全体用户收到一次无意义的「有更新」
# 提示，bundle CI 还会把未经发布验证的新依赖打进 dist 直接分发。改为只提交
# chore/dep-updates 分支累积 lockfile 更新，随下次 test → main 发布合并，依赖变更
# 与功能变更一起过 test 验证后才到达用户。
jobs:
  bump_deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: chore/dep-updates
          fetch-depth: 0

      # 分支不存在时从 main 建出来（首次运行/分支被删）。
      # checkout 在 ref 缺失时整个 job 直接失败，所以不能靠 checkout 的失败兜底——
      # 只能接受这个失败（第一次运行红一次），或用 schedule 前的独立 job 建分支。
      # 这里选择：checkout 失败 = 首次运行，走 dispatch 一次手动建分支即可。
      - name: Fail early with hint if branch missing
        if: failure()
        shell: bash
        run: |-
          echo "::error::chore/dep-updates 分支不存在。在 Actions 页手动运行一次 bump_deps 前先执行："
          echo "::error::git push origin origin/main:refs/heads/chore/dep-updates"

      - name: Use Node.js
        uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Setup pnpm
        uses: pnpm/action-setup@v4.1.0
        with: { version: 10 }

      # 与 main 的依赖面保持同步再 update：分支可能落后 main（上次发布后 main 只有
      # dist bot 提交，package.json 不变；发布合并时 bump 分支以 test 源码为准），
      # 以 main 的 package.json + lockfile 为基线，避免把分支自身的旧状态带进更新
      - name: Sync deps baseline from main
        shell: bash
        run: |-
          git checkout origin/main -- package.json pnpm-lock.yaml

      - run: |
          pnpm update
          pnpm install --lockfile-only

      - name: Commit changes
        uses: EndBug/add-and-commit@v9.1.3
        with:
          default_author: github_actions
          message: '[bot] Bump deps'
